<!DOCTYPE html>
<html>

<head>
    <script src="js\aframe.min.js"></script>
    <script src="js\zappar-aframe\zappar-aframe.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>

    <meta charset="utf-8" />
    <title>Zappar for A-Frame: Face Tracking Masks</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Стили для кнопок переключения */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .btn-mask1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-mask2 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-mask3 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        .btn.active {
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            border: 2px solid white;
        }

        /* Подсказка */
        .hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 1000;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        @media (max-width: 600px) {
            .controls {
                gap: 10px;
                padding: 10px 15px;
                flex-wrap: wrap;
                justify-content: center;
                width: 90%;
            }
            .btn {
                padding: 8px 15px;
                font-size: 14px;
                flex: 1;
                min-width: 80px;
            }
            .hint {
                font-size: 12px;
                padding: 8px 15px;
                top: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- Подсказка -->
    <div class="hint">👆 Нажмите на кнопку, чтобы переключить маску</div>

    <!-- Кнопки переключения -->
    <div class="controls">
        <button class="btn btn-mask1 active" onclick="switchMask(1)"> Маска 1</button>
        <button class="btn btn-mask2" onclick="switchMask(2)"> Маска 2</button>
        <button class="btn btn-mask3" onclick="switchMask(3)"> Маска 3</button>
    </div>

    <a-scene>
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <a-camera zappar-camera="user-facing: true;" />

        <!-- Основной контейнер для масок -->
        <a-entity zappar-face id="face-anchor">
            <a-entity zappar-head-mask="face:#face-anchor;"></a-entity>
            
            <!-- МАСКА 1: 3D модель с анимацией (lik.glb) -->
            <a-entity 
                id="mask1"
                gltf-model="url(cat4.glb)" 
                position="0 0.3 0.388" 
                scale="0.35 0.35 0.35" 
                rotation="0 0 0"
                animation-mixer="loop: repeat; timeScale: 1">
            </a-entity>

            <!-- МАСКА 2: Face mesh с текстурой (Fish.png) -->
            <a-entity 
                id="mask2"
                geometry="primitive: face-mesh; face: #face-anchor" 
                material="src:url(Mask2dc.png); transparent: true;"
                visible="false">
            </a-entity>

            <!-- МАСКА 3: 3D модель рыбки (ribka.glb) -->
            <a-entity 
                id="mask3"
                gltf-model="url(cat1.glb)" 
                position="0 0.3 0.388" 
                scale="0.35 0.35 0.35" 
                rotation="0 0 0"
                visible="false">
            </a-entity>

        </a-entity>
    </a-scene>

    <script>
        // Функция переключения масок
        function switchMask(maskNumber) {
            // Получаем все элементы масок
            const mask1 = document.getElementById('mask1');
            const mask2 = document.getElementById('mask2');
            const mask3 = document.getElementById('mask3');

            // Скрываем все маски
            mask1.setAttribute('visible', 'false');
            mask2.setAttribute('visible', 'false');
            mask3.setAttribute('visible', 'false');

            // Показываем выбранную маску
            if (maskNumber === 1) {
                mask1.setAttribute('visible', 'true');
                // Если у маски есть анимация, запускаем её
                if (mask1.components['animation-mixer']) {
                    mask1.components['animation-mixer'].play();
                }
            } else if (maskNumber === 2) {
                mask2.setAttribute('visible', 'true');
            } else if (maskNumber === 3) {
                mask3.setAttribute('visible', 'true');
            }

            // Обновляем активную кнопку
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach((btn, index) => {
                btn.classList.remove('active');
                if (index === maskNumber - 1) {
                    btn.classList.add('active');
                }
            });
        }

        // При загрузке страницы показываем первую маску
        document.addEventListener('DOMContentLoaded', function() {
            // Убеждаемся, что первая маска видна, остальные скрыты
            const mask1 = document.getElementById('mask1');
            const mask2 = document.getElementById('mask2');
            const mask3 = document.getElementById('mask3');
            
            if (mask1) mask1.setAttribute('visible', 'true');
            if (mask2) mask2.setAttribute('visible', 'false');
            if (mask3) mask3.setAttribute('visible', 'false');
        });

        // Обработка клавиш на клавиатуре для удобства
        document.addEventListener('keydown', function(event) {
            if (event.key === '1') {
                switchMask(1);
            } else if (event.key === '2') {
                switchMask(2);
            } else if (event.key === '3') {
                switchMask(3);
            }
        });

        // Логирование для отладки
        console.log('Маски загружены! Используйте кнопки или клавиши 1, 2, 3 для переключения.');
    </script>
</body>

</html>
